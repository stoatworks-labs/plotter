name: ci

# macOS only, and deliberately. The CMakeLists branches on APPLE and WIN32 and
# has no Linux path at all, so ubuntu is not an option; Windows needs GLEW from
# vcpkg, which is a slow, fragile thing to put in front of every pull request
# for a compile break that would almost certainly show up on macOS too. The
# release workflow still builds both.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v7
        with:
          # The FFGL SDK is a submodule. Without this CMake fails at configure
          # time with a missing-directory error that reads like a broken repo.
          submodules: recursive

      - name: Configure
        # arm64 only, unlike the release build's universal arm64;x86_64 -- the
        # second slice doubles the build for no extra signal, because a source
        # break is not architecture-specific. Passed as a single value with no
        # semicolon, which the shell would split.
        run: >
          cmake -B build
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_OSX_ARCHITECTURES=arm64
          -DPLOTTER_BUILD_TOOLS=ON

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: The checks that need no GPU
        # A hosted macOS runner has no accelerated GL context, so these are the
        # checks that run there: the planner against its closed forms, the
        # machine's clock and grid, the pen sorting, and the parameter names --
        # all plain C++ with no GL in them. The shader check needs glslc, which
        # the runner does not have; it still greps for reserved words and
        # exits 3 for "compile skipped", which is not a failure.
        run: |
          ./build/pltest --names --plan
          tools/check-shaders.sh build/pltest || [ $? -eq 3 ]

      - name: The checks that need a GPU
        # Best effort. The runner falls back to a software rasteriser, which is
        # slow but correct; if it cannot make a 4.1 core context at all this
        # step says so and does not fail the build, because that is a fact
        # about the runner and not about the code. All of them run for real in
        # tools/verify.sh on a machine with a GPU, at 320x180 and 1280x720.
        continue-on-error: true
        run: |
          ./build/pltest --trapezoid --ink --steps --pens --persist --trace --size 320x180
          ./build/pltest --budget --size 320x180
          ./build/pltest --negative --size 320x180

      # Uploading is not only for the artefact. This repo has no package
      # manifest, so github-actions is its only Dependabot ecosystem -- and a
      # bump to actions/upload-artifact otherwise touches release.yml alone, a
      # workflow no pull request ever runs. Using it here means the check
      # actually exercises the action being bumped.
      - uses: actions/upload-artifact@v7
        with:
          name: plotter-macos-arm64
          path: build/*.bundle
          if-no-files-found: error
